  const ITER = 250000;

  function b64(s){
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(password){
    const enc = new TextEncoder();
    const salt = b64(PAYLOAD.salt);
    const iv = b64(PAYLOAD.iv);
    const data = b64(PAYLOAD.data);
    const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations: ITER, hash:"SHA-256"},
      material,
      {name:"AES-GCM", length:256},
      false,
      ["decrypt"]
    );
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
    return new TextDecoder().decode(pt);
  }

  const form = document.getElementById("gate");
  const err = document.getElementById("err");
  const input = document.getElementById("pw");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    const pw = input.value.trim();
    if (!pw){ err.textContent = "Skriv inn passordet."; return; }
    if (!(window.crypto && crypto.subtle)){ err.textContent = "Nettleseren støtter ikke opplåsing. Prøv Safari eller Chrome."; return; }
    const tries = [...new Set([pw, pw.toLowerCase(), pw.charAt(0).toLowerCase()+pw.slice(1)])];
    try {
      let html = null;
      for (const t of tries){ try { html = await decrypt(t); break; } catch(_){} }
      if (html === null) throw new Error("bad");
      document.open();
      document.write(html);
      document.close();
    } catch (ex) {
      err.textContent = "Feil passord, eller siden kunne ikke åpnes.";
      input.select();
    }
  });
  </script>
